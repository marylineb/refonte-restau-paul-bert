  <main>
<form class="contact-form" action="#" method="post">
        <label for="name">Nom complet</label>
        <input type="text" id="name" name="name" placeholder="Entrez votre nom" required>

        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" name="email" placeholder="exemple@mail.com" required>

        <label for="subject">Objet de votre demande</label>
        <input type="text" id="subject" name="subject" placeholder="réservation?" required>

        <label for="message">Votre message</label>
        <textarea id="message" name="message" rows="6"
            placeholder="Parlez-nous de votre expérience..."></textarea>
        <button type="submit" class="cta">Envoyer ma demande ✨</button>
    </form>
